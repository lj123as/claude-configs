# SOURCES.yaml - Upstream source tracking
# Used by sync-upstream.sh to sync external configs

upstream:
  awesome-claude-skills:
    repo: ComposioHQ/awesome-claude-skills
    branch: master
    license: Apache-2.0
    mappings:
      - src: mcp-builder
        dst: skills/_upstream/mcp-builder

  # Example: Add more upstreams as needed
  # everything-claude-code:
  #   repo: affaan-m/everything-claude-code
  #   branch: main
  #   license: MIT
  #   mappings:
  #     - src: agents/code-reviewer
  #       dst: agents/_upstream/code-reviewer

# Sync settings
sync:
  auto_update: false
  preserve_local_changes: true
  backup_before_sync: true
